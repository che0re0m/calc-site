<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>커미션 견적 계산기</title>
  <style>
    :root {
      --bg: #0f1216;
      --panel: #161a20;
      --panel-2: #1d232c;
      --text: #e9eef5;
      --muted: #9fb0c3;
      --accent-2: #8bd3ff;
      --border: #2a3240;
      --good: #9fe6a0;
      --warn: #ffd166;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(1200px 600px at 20% -10%, #1a2230 0%, var(--bg) 60%),
                  radial-gradient(800px 600px at 110% 10%, #1a2230 0%, transparent 60%),
                  var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Noto Sans, Apple SD Gothic Neo, "Malgun Gothic", sans-serif;
      line-height: 1.45;
      font-variant-numeric: tabular-nums;
    }
    .container { max-width: 980px; padding: 24px; margin: 0 auto; }
    h1 { font-size: 22px; font-weight: 700; margin: 0 0 16px; letter-spacing: .2px; }
    .note { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
    .grid { display: grid; gap: 16px; }
    @media (min-width: 860px) { .grid-2 { grid-template-columns: 1.2fr .8fr; } }
    .card {
      background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }
    .section-title { font-size: 14px; font-weight: 700; color: var(--accent-2); margin: 0 0 12px; letter-spacing: .2px; }
    .muted { color: var(--muted); font-size: 13px; }
    .pill { display: inline-block; background: #223049; color: var(--accent-2); border: 1px solid #2d3c57; padding: 2px 8px; border-radius: 999px; font-size: 12px; margin-left: 6px; }
    .options { display: grid; gap: 8px; }
    fieldset { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin: 0; }
    legend { padding: 0 8px; color: var(--muted); font-size: 14px; font-weight: 700; }
    .radio-group, .checkbox-group { display: grid; gap: 0; margin-top: 6px; }
    .person { background: #151b25; border: 1px solid #2a3240; border-radius: 12px; padding: 12px; }
    .person-title { font-size: 14px; font-weight: 700; color: var(--muted); margin-bottom: 8px; }

    /* 옵션 라인: 라벨 | 가격(데스크톱 110px 고정) | 선택 아이콘 */
    label.option {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 110px 24px;
      column-gap: 6px;
      align-items: center;
      padding: 10px 0;  /* 박스 제거 */
      background: transparent;
      border: 0;
      border-radius: 0;
      width: 100%;
      font-size: 14px;
    }
    label.option > span:first-child {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    /* divider: 좌우 인셋 0(행 패딩과 동일) */
    .radio-group .option + .option::before,
    .checkbox-group .option + .option::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 1px;
      background: #2a3446;
    }
    .option .price {
      color: var(--muted);
      font-size: 14px;
      width: 110px;
      min-width: 110px;
      text-align: left;
    }
    label.option input[type="radio"],
    label.option input[type="checkbox"] {
      justify-self: end;
      transform: translateY(1px);
    }
    select {
      background: #1a202a; color: var(--text); border: 1px solid #2a3446;
      border-radius: 10px; padding: 10px 12px; font: inherit;
    }
    /* 모바일: 가격 열 자동폭 + 우측정렬 */
    @media (max-width: 560px) {
      label.option { grid-template-columns: 1fr auto 24px; }
      .option .price { width: auto; min-width: 0; text-align: right; }
    }

    /* 우측 스티키(단일 박스) */
    .result { padding: 6px; }
    .total-line {
      display: grid;
      grid-template-columns: 1fr auto 28px;
      align-items: baseline;
      gap: 8px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .total-line .label { color: #b9cbe0; }
    .total-line .value { font-size: 24px; color: var(--good); }
    .summary-btn {
      background: transparent; border: 0; color: #b9cbe0; cursor: pointer; font-size: 16px;
      padding: 2px; line-height: 1; transform: rotate(0deg); transition: transform .15s ease;
    }
    .summary-btn[aria-expanded="true"] { transform: rotate(180deg); }
    .summary { display: none; color: #cfe6ff; font-size: 13px; margin: 2px 0 10px; }
    .summary.open { display: block; }
    .divider {
      height: 1px;
      background: #2b3b52;
      border: 0;
      margin: 12px 0 10px;
      opacity: .9;
    }
    .kicker { color: var(--muted); font-size: 12px; margin-top: 4px; }

    .reset-btn {
      background: #2a3240;
      color: var(--muted);
      border: 1px solid #3a4452;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 13px;
      cursor: pointer;
      margin-top: 12px;
      width: 100%;
      transition: all 0.15s ease;
    }
    .reset-btn:hover {
      background: #3a4452;
      border-color: #4a5462;
      color: var(--text);
    }

    .hint {
      color: var(--warn);
      font-size: 12px;
      margin: 6px 0 0 2px;
    }

    .people-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

    /* 우측 결과 카드 스티키 고정(데스크톱만) */
    @media (min-width: 860px) {
      .grid.grid-2 > .card:last-child { position: sticky; top: 16px; align-self: start; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>커미션 견적 계산기</h1>
    <div class="note">
      인원별 사이즈와 방식을 선택하고, 추가금 옵션을 선택하면 총액이 계산됩니다.<br />
      총액은 캔버스 한 장당 가격입니다.
    </div>

    <div class="grid grid-2">
      <div class="card">
        <div class="people-header">
          <div class="section-title">인원 선택<span class="pill">최대 5명</span></div>
          <div>
            <label class="muted" for="personCount">인원</label>
            <select id="personCount">
              <option value="1">1명</option>
              <option value="2">2명</option>
              <option value="3">3명</option>
              <option value="4">4명</option>
              <option value="5">5명</option>
            </select>
          </div>
        </div>

        <div id="personsContainer" class="grid" style="margin-top:12px;"></div>

        <div class="section-title" style="margin-top:14px;">추가금</div>
        <div class="options">
          <fieldset>
            <legend>컨펌</legend>
            <div class="radio-group" id="optionD">
              <label class="option"><span>없음</span><span class="price">+0원</span><input type="radio" name="D" value="0" checked></label>
              <label class="option"><span>1회</span><span class="price">+1,000원</span><input type="radio" name="D" value="1000"></label>
              <label class="option"><span>2회</span><span class="price">+2,500원</span><input type="radio" name="D" value="2500"></label>
            </div>
          </fieldset>

          <fieldset>
            <legend>배경</legend>
            <div class="radio-group" id="optionE">
              <label class="option"><span>없음</span><span class="price">+0원</span><input type="radio" name="E" value="0" checked></label>
              <label class="option"><span>간단 배경</span><span class="price">+1,000원</span><input type="radio" name="E" value="1000"></label>
              <label class="option"><span>복잡 배경</span><span class="price">+3,000원</span><input type="radio" name="E" value="3000"></label>
            </div>
          </fieldset>

          <fieldset>
            <legend>추가 옵션</legend>
            <div class="checkbox-group">
              <label class="option"><span>배경 투명화</span><span class="price">+1,000원</span><input type="checkbox" id="optF" /></label>
              <label class="option"><span>유혈</span><span class="price">+1,000원</span><input type="checkbox" id="optG" /></label>
              <label class="option"><span>편집 추가</span><span class="price">+1,500원</span><input type="checkbox" id="optH" /></label>
            </div>
          </fieldset>

          <fieldset>
            <legend>샘플 비공개/빠른 마감</legend>
            <div class="checkbox-group">
              <label class="option"><span>샘플 비공개</span><span class="price">+기본합계의 10%</span><input type="checkbox" id="optI" /></label>
              <label class="option"><span>48시간 빠른 마감</span><span class="price">+기본합계의 50%</span><input type="checkbox" id="optJ" /></label>
            </div>
          </fieldset>
        </div>
      </div>

      <div class="card">
        <div class="result">
          <div class="total-line">
            <span class="label">총액</span>
            <span id="total" class="value">0원</span>
            <button id="toggleSummary" class="summary-btn" aria-expanded="false" aria-controls="summary">▾</button>
          </div>
          <div id="summary" class="summary"></div>
          <div class="divider"></div>
          <div class="kicker">모든 금액은 KRW(원) 기준입니다.</div>
          <div class="kicker">사이트에 오류가 있다면 메시지 주세요.</div>
          <div class="kicker">최종 금액은 협의에 따라 변동될 수 있습니다.</div>
          <button id="resetBtn" class="reset-btn">선택 초기화</button>
        </div>
      </div>
    </div>
  </div>

  <template id="personTemplate">
    <div class="person">
      <div class="person-title"></div>
      <div class="grid">
        <fieldset>
          <legend>사이즈</legend>
          <div class="radio-group size-group">
            <label class="option"><span>두~흉상</span><span class="price">10,000원</span><input type="radio" value="10000"></label>
            <label class="option"><span>반신1(허리)</span><span class="price">13,000원</span><input type="radio" value="13000"></label>
            <label class="option"><span>반신2(허벅지)</span><span class="price">16,000원</span><input type="radio" value="16000"></label>
          </div>
          <div class="hint size-hint" style="display:none;"></div>
        </fieldset>
        <fieldset>
          <legend>방식</legend>
          <div class="radio-group style-group">
            <label class="option"><span>선화</span><span class="price">+0원</span><input type="radio" value="0"></label>
            <label class="option"><span>컬러만</span><span class="price">+2,000원</span><input type="radio" value="2000"></label>
            <label class="option"><span>명암만</span><span class="price">+2,000원</span><input type="radio" value="2000"></label>
          </div>
          <div class="hint style-hint" style="display:none;"></div>
        </fieldset>
      </div>
    </div>
  </template>

  <script>
    const KRW = (n) => `${Math.round(n).toLocaleString('ko-KR')}원`;
    const KRWn = (n) => Math.round(n).toLocaleString('ko-KR');

    const STORAGE_KEY = 'calcState_v3';

    const prices = { F: 1000, G: 1000, H: 1500 };

    const personCountEl = document.getElementById('personCount');
    const personsContainer = document.getElementById('personsContainer');
    const totalEl = document.getElementById('total');
    const summaryEl = document.getElementById('summary');
    const toggleSummaryBtn = document.getElementById('toggleSummary');
    const resetBtn = document.getElementById('resetBtn');

    function resetToDefaults() {
      // 인원 수를 1명으로 초기화
      personCountEl.value = '1';
      renderPersons(1);

      // 모든 라디오 버튼을 첫 번째 옵션으로 초기화
      document.querySelectorAll('input[type="radio"]').forEach(radio => {
        if (radio.name.startsWith('A_') || radio.name.startsWith('B_')) {
          // 인원별 사이즈/방식은 첫 번째 옵션 선택
          if (radio.value === '10000' || radio.value === '0') {
            radio.checked = true;
          }
        } else if (radio.name === 'D' || radio.name === 'E') {
          // 추가금 옵션은 0원 옵션 선택
          if (radio.value === '0') {
            radio.checked = true;
          }
        }
      });

      // 모든 체크박스 해제
      document.getElementById('optF').checked = false;
      document.getElementById('optG').checked = false;
      document.getElementById('optH').checked = false;
      document.getElementById('optI').checked = false;
      document.getElementById('optJ').checked = false;

      // 계산 및 렌더링 업데이트
      computeAndRender();
    }

    function renderPersons(count) {
      personsContainer.innerHTML = '';
      const tpl = document.getElementById('personTemplate');
      for (let i = 1; i <= count; i++) {
        const node = tpl.content.firstElementChild.cloneNode(true);
        node.querySelector('.person-title').textContent = `인원 ${i}`;
        const sizeRadios = node.querySelectorAll('.size-group input[type="radio"]');
        const styleRadios = node.querySelectorAll('.style-group input[type="radio"]');
        sizeRadios.forEach(r => r.name = `A_${i}`);
        styleRadios.forEach(r => r.name = `B_${i}`);
        sizeRadios[0].checked = true;
        styleRadios[0].checked = true;
        personsContainer.appendChild(node);
      }
    }

    function getPersonCost(personNode) {
      const size = personNode.querySelector('.size-group input[type="radio"]:checked');
      const style = personNode.querySelector('.style-group input[type="radio"]:checked');
      const a = size ? Number(size.value) : 0;
      const b = style ? Number(style.value) : 0;
      return { a, b, sum: a + b, hasSize: !!size, hasStyle: !!style };
    }

    function getFixedCosts() {
      const d = Number((document.querySelector('#optionD input[type="radio"]:checked') || { value: 0 }).value);
      const e = Number((document.querySelector('#optionE input[type="radio"]:checked') || { value: 0 }).value);
      const f = document.getElementById('optF').checked ? prices.F : 0;
      const g = document.getElementById('optG').checked ? prices.G : 0;
      const h = document.getElementById('optH').checked ? prices.H : 0;
      return { d, e, f, g, h, n: d + e + f + g + h };
    }

    function validateRequired() {
      const personNodes = personsContainer.querySelectorAll('.person');
      let ok = true;
      personNodes.forEach(node => {
        const { hasSize, hasStyle } = getPersonCost(node);
        const sizeHint = node.querySelector('.size-hint');
        const styleHint = node.querySelector('.style-hint');
        if (!hasSize) {
          sizeHint.textContent = '사이즈를 선택해 주세요.';
          sizeHint.style.display = 'block';
          ok = false;
        } else sizeHint.style.display = 'none';
        if (!hasStyle) {
          styleHint.textContent = '방식을 선택해 주세요.';
          styleHint.style.display = 'block';
          ok = false;
        } else styleHint.style.display = 'none';
      });
      return ok;
    }

    function buildSummary(m, fixed, base, iChecked, jChecked, total) {
      const terms = [`기본 ${KRWn(m)}`];
      if (fixed.e) terms.push(`배경 ${KRWn(fixed.e)}`);
      if (fixed.d) terms.push(`컨펌 ${KRWn(fixed.d)}`);
      if (fixed.f) terms.push(`투명화 ${KRWn(fixed.f)}`);
      if (fixed.g) terms.push(`유혈 ${KRWn(fixed.g)}`);
      if (fixed.h) terms.push(`편집 ${KRWn(fixed.h)}`);
      if (iChecked) terms.push('샘플 10%');
      if (jChecked) terms.push('마감 50%');
      return `${terms.join(' + ')} = ${KRW(total)}`;
    }

    function computeAndRender() {
      const personNodes = personsContainer.querySelectorAll('.person');
      let m = 0;
      personNodes.forEach(node => { m += getPersonCost(node).sum; });

      const fixed = getFixedCosts();
      const base = m + fixed.n;

      const iChecked = document.getElementById('optI').checked;
      const jChecked = document.getElementById('optJ').checked;
      const addI = iChecked ? base * 0.10 : 0;
      const addJ = jChecked ? base * 0.50 : 0;
      const total = base + addI + addJ;

      totalEl.textContent = KRW(total);
      summaryEl.textContent = buildSummary(m, fixed, base, iChecked, jChecked, total);

      validateRequired();
      saveState();
    }

    function saveState() {
      const state = { personCount: Number(personCountEl.value), persons: [] };
      const count = state.personCount;
      for (let i = 1; i <= count; i++) {
        const size = document.querySelector(`input[name="A_${i}"]:checked`);
        const style = document.querySelector(`input[name="B_${i}"]:checked`);
        state.persons.push({
          size: size ? Number(size.value) : null,
          style: style ? Number(style.value) : null
        });
      }
      const d = document.querySelector('#optionD input[type="radio"]:checked');
      const e = document.querySelector('#optionE input[type="radio"]:checked');
      state.D = d ? Number(d.value) : 0;
      state.E = e ? Number(e.value) : 0;
      state.F = document.getElementById('optF').checked;
      state.G = document.getElementById('optG').checked;
      state.H = document.getElementById('optH').checked;
      state.I = document.getElementById('optI').checked;
      state.J = document.getElementById('optJ').checked;

      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function restoreState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const s = JSON.parse(raw);
        if (!s || !s.personCount) return;

        personCountEl.value = String(Math.max(1, Math.min(5, s.personCount)));
        renderPersons(Number(personCountEl.value));

        // restore per person
        s.persons?.forEach((p, idx) => {
          const i = idx + 1;
          if (p?.size != null) {
            const r = document.querySelector(`input[name="A_${i}"][value="${p.size}"]`);
            if (r) r.checked = true;
          }
          if (p?.style != null) {
            const r = document.querySelector(`input[name="B_${i}"][value="${p.style}"]`);
            if (r) r.checked = true;
          }
        });

        // restore fixed options
        const d = document.querySelector(`#optionD input[value="${s.D ?? 0}"]`);
        if (d) d.checked = true;
        const e = document.querySelector(`#optionE input[value="${s.E ?? 0}"]`);
        if (e) e.checked = true;
        document.getElementById('optF').checked = !!s.F;
        document.getElementById('optG').checked = !!s.G;
        document.getElementById('optH').checked = !!s.H;
        document.getElementById('optI').checked = !!s.I;
        document.getElementById('optJ').checked = !!s.J;
      } catch (_) {
        // ignore corrupted state
      }
    }

    personCountEl.addEventListener('change', () => {
      const count = Math.max(1, Math.min(5, Number(personCountEl.value) || 1));
      renderPersons(count);
      computeAndRender();
    });

    document.addEventListener('input', (e) => {
      if (e.target.matches('input, select')) computeAndRender();
    });

    toggleSummaryBtn.addEventListener('click', () => {
      const open = toggleSummaryBtn.getAttribute('aria-expanded') === 'true';
      toggleSummaryBtn.setAttribute('aria-expanded', String(!open));
      summaryEl.classList.toggle('open', !open);
    });

    resetBtn.addEventListener('click', resetToDefaults);

    // init
    renderPersons(1);
    restoreState();
    computeAndRender();
  </script>
</body>
</html>
